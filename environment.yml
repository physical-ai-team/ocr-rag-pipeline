# 팀 공용 Python 환경
# 처음:      conda env create -f environment.yml
# 업데이트:  conda env update -f environment.yml --prune
# 패키지를 추가할 때는 이 파일을 수정해서 커밋하고 팀에 공지하세요. (버전은 == 로 고정)
name: ocr-rag
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - python-dotenv==1.0.1
      # api 서비스 (services/api)
      - fastapi==0.162.0
      - uvicorn[standard]==0.54.0
      - httpx==0.28.1             # api → pipeline 호출
      - google-genai==2.33.0      # RAG 답변 (Gemini)
      # pipeline 서비스 (services/pipeline) — 처음 설치 때 torch 때문에 오래 걸린다
      - torch==2.14.1
      - torchvision==0.29.1
      - pillow==13.0.0
      - numpy==2.4.6
      - supabase==2.33.0
      - sentence-transformers==6.2.0
      - easyocr==1.7.2
      - pytesseract==0.3.13   # OCR_ENGINE=tesseract 쓸 때만 필요 (Tesseract 본체는 별도 설치)
      # 테스트
      - pytest==9.1.1
